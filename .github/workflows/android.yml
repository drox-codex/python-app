name: Android CI & Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper || true
            chmod +x gradlew || true
          fi

      - name: Run Unit & Robolectric Tests
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew testDebugUnitTest --stacktrace
          else
            gradle testDebugUnitTest --stacktrace
          fi

      - name: Build Debug APK
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
          # Copy to friendly name for direct APK download
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Python-IDE.apk

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Python-IDE-APK
          path: app/build/outputs/apk/debug/Python-IDE.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Python IDE for Android v1.0.0 (APK)"
          body: |
            ### 🐍 Python IDE for Android
            Download the ready-to-install Android APK below:
            - **Python-IDE.apk** (Android 7.0+ / API 24+)
            
            Strictly Non-Commercial & Free Educational License.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/Python-IDE.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
